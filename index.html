<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Table Devotions</title>
<meta name="description" content="Nightly Lutheran family devotions with ESV Scripture and kids' activity sheets.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f5a43'/%3E%3Cpath d='M14 6h4v6h6v4h-6v10h-4V16H8v-4h6z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<header class="bar"><div class="wrap">
  <div class="brand"><h1>Family Table Devotions</h1><button class="today" id="todayBtn" type="button">Today</button></div>
  <div class="weeknav">
    <button class="arrow" id="prevWeek" type="button" aria-label="Previous week">‹</button>
    <nav class="days" id="days" aria-label="Choose a day"></nav>
    <button class="arrow" id="nextWeek" type="button" aria-label="Next week">›</button>
  </div>
</div></header>
<main class="wrap" id="main"><p class="note">Loading…</p></main>
<div id="printArea" aria-hidden="true"></div>
<script src="app.js"></script>
